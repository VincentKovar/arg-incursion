<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Play Theory LCARS Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #050508;
            color: #e2e8f0;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        .lcars-bar-glow {
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }
        ::-webkit-scrollbar {
            width: 3px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0f17;
        }
        ::-webkit-scrollbar-thumb {
            background: #38bdf8;
            border-radius: 2px;
        }
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.96); }
        }
        .pulse-hex {
            animation: pulse-subtle 4s infinite ease-in-out;
        }
        .clip-hex { 
            clip-path: polygon(25% 6%, 75% 6%, 100% 50%, 75% 94%, 25% 94%, 0% 50%); 
        }
        .calc-btn {
            transition: all 0.1s ease;
        }
        .calc-btn:active {
            transform: scale(0.92);
            filter: brightness(1.3);
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen p-1 sm:p-2 bg-black">

    <div id="app-container" class="w-full max-w-sm bg-black border border-slate-800 rounded-2xl p-2.5 shadow-2xl relative flex flex-col justify-between overflow-hidden lcars-bar-glow" style="height: 100vh; max-height: 860px;">

        <!-- ========================================== -->
        <!-- SECTION: TOP LCARS HEADER -->
        <!-- ========================================== -->
        <header class="flex justify-between items-center border-b border-slate-800 pb-2 mb-1 shrink-0">
            <div class="flex items-center space-x-1.5">
                <div class="w-6 h-3 bg-orange-500 rounded-r-full"></div>
                <div class="w-3 h-3 bg-cyan-400 rounded-full animate-ping"></div>
                <span class="text-[10px] tracking-widest text-orange-400 font-bold">LCARS-PLAY // 2268</span>
            </div>
            <div class="flex space-x-1">
                <div class="w-5 h-2.5 bg-cyan-500 rounded"></div>
                <div class="w-8 h-2.5 bg-orange-500 rounded"></div>
                <div class="w-3 h-2.5 bg-rose-500 rounded-r"></div>
            </div>
        </header>

        <div class="grid grid-cols-5 gap-1.5 flex-grow overflow-y-auto py-0.5 pr-0.5">
            
            <!-- ========================================== -->
            <!-- SECTION: COLUMN 1 - BRAIN / PAIDIA COLUMN -->
            <!-- ========================================== -->
            <div class="col-span-1 flex flex-col items-center justify-between bg-slate-950/70 p-1 rounded-xl border border-slate-800/80 relative">
                <div class="text-[9px] text-cyan-400 tracking-wider font-bold">MT</div>
                
                <!-- Vertical Bar Container -->
                <div class="relative w-4 flex-grow bg-slate-900 rounded-full my-1 overflow-hidden flex flex-col justify-end border border-slate-700">
                    <div class="absolute inset-0 flex flex-col justify-between py-1 px-0.5 pointer-events-none opacity-40">
                        <div class="w-full h-[1px] bg-cyan-200"></div>
                        <div class="w-full h-[1px] bg-slate-500"></div>
                        <div class="w-full h-[1px] bg-cyan-200"></div>
                        <div class="w-full h-[1px] bg-slate-500"></div>
                        <div class="w-full h-[1px] bg-cyan-200"></div>
                        <div class="w-full h-[1px] bg-slate-500"></div>
                        <div class="w-full h-[1px] bg-cyan-200"></div>
                    </div>
                    <div id="bar-paid" class="w-full bg-gradient-to-t from-cyan-600 to-cyan-400 rounded-b-full transition-all duration-300" style="height: 75%;"></div>
                    <div id="arrow-paid" class="absolute right-[-5px] top-[25%] w-0 h-0 border-t-[4px] border-t-transparent border-b-[4px] border-b-transparent border-l-[6px] border-l-orange-400 filter drop-shadow transition-all duration-300"></div>
                </div>

                <div class="text-[8px] text-orange-400 font-bold">BRAIN</div>
            </div>

            <!-- ========================================== -->
            <!-- SECTION: COLUMNS 2 & 3 - CENTRAL CONTROLS & MODULES -->
            <!-- ========================================== -->
            <div class="col-span-2 flex flex-col justify-between py-0.5 px-0.5 space-y-1">
                
                <!-- SUB-SECTION: TOP COLOR BLOCKS ROW (100 - 190) -->
                <div class="grid grid-cols-4 gap-1">
                    <div class="h-5 bg-cyan-400 rounded flex items-center justify-center text-[9px] text-black font-bold shadow">100</div>
                    <div class="h-5 bg-orange-200 rounded flex items-center justify-center text-[9px] text-black font-bold shadow">120</div>
                    <div class="h-5 bg-orange-400 rounded flex items-center justify-center text-[9px] text-black font-bold shadow">140</div>
                    <div class="h-5 bg-rose-500 rounded flex items-center justify-center text-[9px] text-white font-bold shadow">190</div>
                </div>

                <!-- SUB-SECTION: HEX-STATE MATRIX GRID -->
                <div class="bg-slate-900/60 p-1 rounded-lg border border-slate-800 flex flex-col justify-center items-center space-y-1">
                    <div class="text-[7px] text-cyan-300 tracking-wider font-bold">HEX-STATE MATRIX</div>
                    <div class="grid grid-cols-4 gap-1.5 w-full px-1">
                        <div class="w-full aspect-square bg-cyan-400 clip-hex pulse-hex flex items-center justify-center text-[7px] font-bold text-black shadow" style="animation-delay: 0s;">AG</div>
                        <div class="w-full aspect-square bg-orange-300 clip-hex pulse-hex flex items-center justify-center text-[7px] font-bold text-black shadow" style="animation-delay: 0.8s;">AL</div>
                        <div class="w-full aspect-square bg-rose-400 clip-hex pulse-hex flex items-center justify-center text-[7px] font-bold text-black shadow" style="animation-delay: 1.6s;">IL</div>
                        <div class="w-full aspect-square bg-cyan-600 clip-hex pulse-hex flex items-center justify-center text-[7px] font-bold text-white shadow" style="animation-delay: 2.4s;">MM</div>
                        <div class="w-full aspect-square bg-orange-500 clip-hex pulse-hex flex items-center justify-center text-[7px] font-bold text-black shadow" style="animation-delay: 1.2s;">LD</div>
                        <div class="w-full aspect-square bg-rose-600 clip-hex pulse-hex flex items-center justify-center text-[7px] font-bold text-white shadow" style="animation-delay: 0.4s;">PD</div>
                        <div class="w-full aspect-square bg-cyan-300 clip-hex pulse-hex flex items-center justify-center text-[7px] font-bold text-black shadow" style="animation-delay: 2.0s;">AX</div>
                        <div class="w-full aspect-square bg-orange-200 clip-hex pulse-hex flex items-center justify-center text-[7px] font-bold text-black shadow" style="animation-delay: 1.5s;">FL</div>
                    </div>
                </div>

                <!-- SUB-SECTION: NUMBER BADGES ROW (10 - 175) -->
                <div class="grid grid-cols-4 gap-1 text-center pt-0.5">
                    <div class="bg-cyan-500/20 border border-cyan-400 text-cyan-300 text-[9px] py-0.5 rounded cursor-pointer hover:bg-cyan-500 hover:text-black transition" onclick="triggerBoost('alea')">10</div>
                    <div class="bg-orange-300/20 border border-orange-300 text-orange-200 text-[9px] py-0.5 rounded cursor-pointer hover:bg-orange-300 hover:text-black transition" onclick="triggerBoost('agon')">20</div>
                    <div class="bg-rose-400/20 border border-rose-400 text-rose-300 text-[9px] py-0.5 rounded cursor-pointer hover:bg-rose-400 hover:text-black transition" onclick="triggerBoost('ilinx')">80</div>
                    <div class="bg-rose-600/20 border border-rose-500 text-rose-400 text-[9px] py-0.5 rounded cursor-pointer hover:bg-rose-600 hover:text-white transition" onclick="triggerBoost('mimic')">175</div>
                </div>

                <!-- SUB-SECTION: INTERACTIVE TOUCH CALCULATOR -->
                <div class="bg-black border border-cyan-500/50 rounded-lg p-1.5 flex flex-col space-y-1 shadow-inner">
                    <div id="calc-display" class="bg-slate-950 border border-cyan-400/40 rounded px-2 py-1 text-right text-cyan-300 text-xs font-mono tracking-wider truncate">0</div>
                    <div class="grid grid-cols-4 gap-1">
                        <button onclick="calcInput('7')" class="calc-btn bg-cyan-950/80 border border-cyan-600/50 text-cyan-200 text-[9px] py-1 rounded font-bold">7</button>
                        <button onclick="calcInput('8')" class="calc-btn bg-cyan-950/80 border border-cyan-600/50 text-cyan-200 text-[9px] py-1 rounded font-bold">8</button>
                        <button onclick="calcInput('9')" class="calc-btn bg-cyan-950/80 border border-cyan-600/50 text-cyan-200 text-[9px] py-1 rounded font-bold">9</button>
                        <button onclick="calcInput('/')" class="calc-btn bg-orange-900/80 border border-orange-500/50 text-orange-200 text-[9px] py-1 rounded font-bold">÷</button>
                        
                        <button onclick="calcInput('4')" class="calc-btn bg-cyan-950/80 border border-cyan-600/50 text-cyan-200 text-[9px] py-1 rounded font-bold">4</button>
                        <button onclick="calcInput('5')" class="calc-btn bg-cyan-950/80 border border-cyan-600/50 text-cyan-200 text-[9px] py-1 rounded font-bold">5</button>
                        <button onclick="calcInput('6')" class="calc-btn bg-cyan-950/80 border border-cyan-600/50 text-cyan-200 text-[9px] py-1 rounded font-bold">6</button>
                        <button onclick="calcInput('*')" class="calc-btn bg-orange-900/80 border border-orange-500/50 text-orange-200 text-[9px] py-1 rounded font-bold">×</button>
                        
                        <button onclick="calcInput('1')" class="calc-btn bg-cyan-950/80 border border-cyan-600/50 text-cyan-200 text-[9px] py-1 rounded font-bold">1</button>
                        <button onclick="calcInput('2')" class="calc-btn bg-cyan-950/80 border border-cyan-600/50 text-cyan-200 text-[9px] py-1 rounded font-bold">2</button>
                        <button onclick="calcInput('3')" class="calc-btn bg-cyan-950/80 border border-cyan-600/50 text-cyan-200 text-[9px] py-1 rounded font-bold">3</button>
                        <button onclick="calcInput('-')" class="calc-btn bg-orange-900/80 border border-orange-500/50 text-orange-200 text-[9px] py-1 rounded font-bold">-</button>
                        
                        <button onclick="calcClear()" class="calc-btn bg-rose-950/80 border border-rose-500/50 text-rose-300 text-[9px] py-1 rounded font-bold">C</button>
                        <button onclick="calcInput('0')" class="calc-btn bg-cyan-950/80 border border-cyan-600/50 text-cyan-200 text-[9px] py-1 rounded font-bold">0</button>
                        <button onclick="calcCompute()" class="calc-btn bg-cyan-500 text-black text-[9px] py-1 rounded font-bold">=</button>
                        <button onclick="calcInput('+')" class="calc-btn bg-orange-900/80 border border-orange-500/50 text-orange-200 text-[9px] py-1 rounded font-bold">+</button>
                    </div>
                </div>

            </div>

            <!-- ========================================== -->
            <!-- SECTION: COLUMN 4 - CIRC / LUDUS COLUMN -->
            <!-- ========================================== -->
            <div class="col-span-1 flex flex-col items-center justify-between bg-slate-950/70 p-1 rounded-xl border border-slate-800/80 relative">
                <div class="text-[9px] text-orange-400 tracking-wider font-bold">CIRC</div>
                
                <div class="relative w-4 flex-grow bg-slate-900 rounded-full my-1 overflow-hidden flex flex-col justify-end border border-slate-700">
                    <div class="absolute inset-0 flex flex-col justify-between py-1 px-0.5 pointer-events-none opacity-40">
                        <div class="w-full h-[1px] bg-orange-300"></div>
                        <div class="w-full h-[1px] bg-slate-500"></div>
                        <div class="w-full h-[1px] bg-orange-300"></div>
                        <div class="w-full h-[1px] bg-slate-500"></div>
                        <div class="w-full h-[1px] bg-orange-300"></div>
                    </div>
                    <div id="bar-ludus" class="w-full bg-gradient-to-t from-orange-600 to-orange-400 rounded-b-full transition-all duration-300" style="height: 55%;"></div>
                    <div id="arrow-ludus" class="absolute left-[-5px] top-[45%] w-0 h-0 border-t-[4px] border-t-transparent border-b-[4px] border-b-transparent border-r-[6px] border-r-cyan-400 filter drop-shadow transition-all duration-300"></div>
                </div>

                <div class="text-[8px] text-cyan-400 font-bold">PWR</div>
            </div>

            <!-- ========================================== -->
            <!-- SECTION: COLUMN 5 - RESP & TEMP COLUMNS -->
            <!-- ========================================== -->
            <div class="col-span-1 flex flex-col space-y-1.5">
                <!-- SUB-SECTION: RESP / ILINX METER -->
                <div class="flex-1 bg-slate-950/70 p-1 rounded-lg border border-slate-800 flex flex-col items-center justify-between relative">
                    <div class="text-[7px] text-cyan-400 font-bold">IUM</div>
                    <div class="relative w-2.5 flex-grow bg-slate-900 rounded-full my-0.5 overflow-hidden flex flex-col justify-end border border-slate-700">
                        <div id="bar-ilinx" class="w-full bg-cyan-500 rounded-b-full transition-all duration-300" style="height: 40%;"></div>
                        <div id="arrow-ilinx" class="absolute right-[-4px] top-[60%] w-0 h-0 border-t-[3px] border-t-transparent border-b-[3px] border-b-transparent border-l-[4px] border-l-rose-500"></div>
                    </div>
                    <div class="text-[6px] text-slate-400">CYCLES</div>
                </div>

                <!-- SUB-SECTION: TEMP / MIMICRY METER -->
                <div class="flex-1 bg-slate-950/70 p-1 rounded-lg border border-slate-800 flex flex-col items-center justify-between relative">
                    <div class="text-[7px] text-rose-400 font-bold">LJ/EL</div>
                    <div class="relative w-2.5 flex-grow bg-slate-900 rounded-full my-0.5 overflow-hidden flex flex-col justify-end border border-slate-700">
                        <div id="bar-mimicry" class="w-full bg-rose-500 rounded-b-full transition-all duration-300" style="height: 88%;"></div>
                        <div id="arrow-mimicry" class="absolute left-[-4px] top-[32%] w-0 h-0 border-t-[3px] border-t-transparent border-b-[3px] border-b-transparent border-r-[4px] border-r-cyan-400"></div>
                    </div>
                    <div class="text-[6px] text-slate-400">TEMP</div>
                </div>
            </div>

        </div>

        <!-- ========================================== -->
        <!-- SECTION: FOOTER STATUS & MODE SWITCHERS -->
        <!-- ========================================== -->
        <footer class="mt-1 pt-1.5 border-t border-slate-800 flex flex-col space-y-1.5 shrink-0">
            <div class="flex justify-between items-center text-[10px]">
                <span class="text-cyan-400 font-semibold truncate" id="mode-status">BALANCED PLAY FLOW</span>
                <span class="text-orange-400 font-mono" id="clock-display">00:00:00</span>
            </div>

            <div class="grid grid-cols-3 gap-1.5">
                <button onclick="setPlayMode('paedian')" class="bg-cyan-950 border border-cyan-500/60 text-cyan-300 text-[9px] py-1 rounded hover:bg-cyan-500 hover:text-black font-bold transition">PAIDIA BURST</button>
                <button onclick="setPlayMode('balanced')" class="bg-orange-950 border border-orange-500/60 text-orange-300 text-[9px] py-1 rounded hover:bg-orange-500 hover:text-black font-bold transition">CALIBRATE</button>
                <button onclick="setPlayMode('ludic')" class="bg-rose-950 border border-rose-500/60 text-rose-300 text-[9px] py-1 rounded hover:bg-rose-500 hover:text-black font-bold transition">LUDUS RIGOR</button>
            </div>
        </footer>

    </div>

    <script>
        // Clock update timer
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock-display').innerText = now.toTimeString().split(' ')[0];
        }, 1000);

        // Simulation telemetry variables
        let paidiaVal = 75;
        let ludusVal = 55;
        let ilinxVal = 40;
        let mimicVal = 88;
        let agonVal = 71;
        let aleaVal = 108;

        // Calculator state
        let calcExpression = "";

        function updateUI() {
            document.getElementById('bar-paid').style.height = paidiaVal + '%';
            document.getElementById('bar-ludus').style.height = ludusVal + '%';
            document.getElementById('bar-ilinx').style.height = ilinxVal + '%';
            document.getElementById('bar-mimicry').style.height = mimicVal + '%';

            document.getElementById('arrow-paid').style.top = (100 - paidiaVal) + '%';
            document.getElementById('arrow-ludus').style.top = (100 - ludusVal) + '%';
            document.getElementById('arrow-ilinx').style.top = (100 - ilinxVal) + '%';
            document.getElementById('arrow-mimicry').style.top = (100 - mimicVal) + '%';
        }

        function setPlayMode(mode) {
            const statusElem = document.getElementById('mode-status');
            if(mode === 'paedian') {
                paidiaVal = 92;
                ludusVal = 25;
                ilinxVal = 85;
                mimicVal = 60;
                agonVal = 40;
                aleaVal = 145;
                statusElem.innerText = "MODE: PAIDIA SPONTANEITY";
            } else if(mode === 'ludic') {
                paidiaVal = 30;
                ludusVal = 90;
                ilinxVal = 20;
                mimicVal = 95;
                agonVal = 135;
                aleaVal = 45;
                statusElem.innerText = "MODE: LUDUS STRUCTURED";
            } else {
                paidiaVal = 75;
                ludusVal = 55;
                ilinxVal = 40;
                mimicVal = 88;
                agonVal = 71;
                aleaVal = 108;
                statusElem.innerText = "BALANCED PLAY FLOW";
            }
            updateUI();
        }

        function triggerBoost(type) {
            if(type === 'alea') {
                aleaVal = Math.min(200, aleaVal + 15);
                paidiaVal = Math.min(100, paidiaVal + 10);
            } else if(type === 'agon') {
                agonVal = Math.min(200, agonVal + 15);
                ludusVal = Math.min(100, ludusVal + 10);
            } else if(type === 'ilinx') {
                ilinxVal = Math.min(100, ilinxVal + 20);
            } else if(type === 'mimic') {
                mimicVal = Math.min(100, mimicVal + 15);
            }
            updateUI();
        }

        // Calculator input and computation functions
        function calcInput(val) {
            if (calcExpression.length < 14) {
                calcExpression += val;
                document.getElementById('calc-display').innerText = calcExpression;
            }
        }

        function calcClear() {
            calcExpression = "";
            document.getElementById('calc-display').innerText = "0";
        }

        function calcCompute() {
            try {
                const sanitized = calcExpression.replace(/[^0-9+\-*/.]/g, '');
                if(sanitized) {
                    const result = Function('"use strict";return (' + sanitized + ')')();
                    calcExpression = String(Math.round(result * 100) / 100);
                    document.getElementById('calc-display').innerText = calcExpression;
                }
            } catch(e) {
                document.getElementById('calc-display').innerText = "ERR";
                calcExpression = "";
            }
        }

        // Periodic natural fluctuation to simulate active telemetry
        setInterval(() => {
            paidiaVal = Math.max(15, Math.min(95, paidiaVal + (Math.random() * 6 - 3)));
            ludusVal = Math.max(15, Math.min(95, ludusVal + (Math.random() * 6 - 3)));
            ilinxVal = Math.max(10, Math.min(90, ilinxVal + (Math.random() * 8 - 4)));
            mimicVal = Math.max(20, Math.min(98, mimicVal + (Math.random() * 4 - 2)));
            updateUI();
        }, 3000);
    </script>

</body>
</html>
