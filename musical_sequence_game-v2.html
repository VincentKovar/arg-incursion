<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Melody Master - Sequence Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* RE-SKIN THESE CSS VARIABLES FOR QUICK THEMING */
            --primary-glow: rgba(99, 102, 241, 0.5);
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(30, 58, 138, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(79, 70, 229, 0.1) 0%, transparent 50%);
            touch-action: none;
            overflow: hidden;
            color: white;
        }

        .pad-active {
            transform: scale(0.95);
            filter: brightness(1.5);
            box-shadow: 0 0 30px var(--primary-glow);
        }

        .screen-transition {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .animate-pulse-soft {
            animation: pulse-soft 2s infinite;
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen w-full">

    
    <!-- 1. WELCOME SCREEN -->
    <div id="screen-welcome" class="screen-transition fixed inset-0 flex flex-col items-center justify-center p-6 text-center">
        <div class="glass p-8 rounded-3xl max-w-sm w-full shadow-2xl">
            <h1 class="text-4xl font-extrabold mb-2 bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-400">
                Melody Master
            </h1>
            <p class="text-slate-400 mb-8 font-light">Listen to the sequence and repeat it back to unlock the next level.</p>
            <button id="btn-start" class="w-full py-4 bg-indigo-600 hover:bg-indigo-500 rounded-2xl font-bold transition-all active:scale-95 shadow-lg shadow-indigo-500/20">
                START GAME
            </button>
        </div>
    </div>

    <!-- 2. MAIN GAME SCREEN -->
    <div id="screen-game" class="screen-transition fixed inset-0 flex flex-col items-center justify-center p-6 hidden opacity-0 scale-95">
        <div class="mb-8 text-center">
            <div id="game-status" class="text-indigo-400 font-semibold tracking-widest uppercase text-sm mb-1">Watch Closely</div>
            <div id="game-step" class="text-2xl font-bold">Step 1 of 8</div>
        </div>

        <div class="grid grid-cols-2 gap-4 w-full max-w-sm" id="pad-grid">
            <!-- Pads are generated by JS but styled here -->
            <button data-index="0" class="pad aspect-square glass rounded-3xl border-2 border-indigo-500/30 transition-all flex items-center justify-center">
                <div class="w-4 h-4 rounded-full bg-indigo-500/50"></div>
            </button>
            <button data-index="1" class="pad aspect-square glass rounded-3xl border-2 border-purple-500/30 transition-all flex items-center justify-center">
                <div class="w-4 h-4 rounded-full bg-purple-500/50"></div>
            </button>
            <button data-index="2" class="pad aspect-square glass rounded-3xl border-2 border-pink-500/30 transition-all flex items-center justify-center">
                <div class="w-4 h-4 rounded-full bg-pink-500/50"></div>
            </button>
            <button data-index="3" class="pad aspect-square glass rounded-3xl border-2 border-blue-500/30 transition-all flex items-center justify-center">
                <div class="w-4 h-4 rounded-full bg-blue-500/50"></div>
            </button>
        </div>

        <button id="btn-replay" class="mt-8 px-6 py-2 rounded-full border border-slate-700 text-slate-400 text-sm hover:bg-slate-800 transition-colors hidden">
            Replay Sequence
        </button>
    </div>

    <!-- 3. SUCCESS SCREEN (The "Advancement" Page) -->
    <div id="screen-success" class="screen-transition fixed inset-0 flex flex-col items-center justify-center p-6 text-center hidden opacity-0 translate-y-10">
        <div class="glass p-10 rounded-[3rem] max-w-sm w-full shadow-2xl border-indigo-500/20">
            <div class="w-20 h-20 bg-green-500/20 text-green-400 rounded-full flex items-center justify-center mx-auto mb-6 text-4xl">
                ✓
            </div>
            <h1 class="text-3xl font-bold mb-4">Sequence Mastery!</h1>
            <p class="text-slate-400 mb-8">You've successfully completed Beethoven's "Ode to Joy" opening phrase.</p>
            <button onclick="location.reload()" class="w-full py-4 bg-white text-slate-900 rounded-2xl font-bold transition-all active:scale-95">
                NEXT LEVEL
            </button>
        </div>
    </div>

    <script>
        
        // --- RE-SKIN CONFIGURATION ---
        const CONFIG = {
            melody: [
                { pad: 0, freq: 329.63 }, // E4
                { pad: 0, freq: 329.63 }, // E4
                { pad: 1, freq: 349.23 }, // F4
                { pad: 2, freq: 392.00 }, // G4
                { pad: 2, freq: 392.00 }, // G4
                { pad: 1, freq: 349.23 }, // F4
                { pad: 0, freq: 329.63 }, // E4
                { pad: 3, freq: 261.63 }  // C4
            ],
            flashDuration: 300,
            playbackSpeed: 600,
            colors: ['#6366f1', '#a855f7', '#ec4899', '#3b82f6']
        };

        // --- STATE MANAGEMENT ---
        let gameState = 'WELCOME';
        let userProgress = 0;
        let isPlayingSequence = false;
        let audioCtx = null;

        const screens = {
            welcome: document.getElementById('screen-welcome'),
            game: document.getElementById('screen-game'),
            success: document.getElementById('screen-success')
        };

        const statusEl = document.getElementById('game-status');
        const stepEl = document.getElementById('game-step');
        const pads = document.querySelectorAll('.pad');


        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playNote(freq, padIndex) {
            if (!audioCtx) initAudio();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'triangle'; // Smoother classical sound
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);

            // Visual feedback
            const pad = pads[padIndex];
            pad.classList.add('pad-active');
            pad.style.backgroundColor = CONFIG.colors[padIndex] + '33'; // 20% opacity
            
            setTimeout(() => {
                pad.classList.remove('pad-active');
                pad.style.backgroundColor = '';
            }, CONFIG.flashDuration);
        }


        async function playSequence() {
            isPlayingSequence = true;
            statusEl.innerText = "Listen...";
            statusEl.classList.add('animate-pulse-soft');
            
            for (let i = 0; i < CONFIG.melody.length; i++) {
                const note = CONFIG.melody[i];
                playNote(note.freq, note.pad);
                await new Promise(r => setTimeout(r, CONFIG.playbackSpeed));
            }
            
            statusEl.innerText = "Your Turn";
            statusEl.classList.remove('animate-pulse-soft');
            isPlayingSequence = false;
        }

        function handlePadPress(idx) {
            if (isPlayingSequence || gameState !== 'PLAYING') return;

            const expectedNote = CONFIG.melody[userProgress];
            playNote(CONFIG.melody[idx].freq, idx);

            if (parseInt(idx) === expectedNote.pad) {
                userProgress++;
                updateProgressUI();
                
                if (userProgress === CONFIG.melody.length) {
                    transitionTo('success');
                }
            } else {
                // Fail state
                statusEl.innerText = "Try Again!";
                statusEl.classList.add('text-red-400');
                userProgress = 0;
                updateProgressUI();
                
                setTimeout(() => {
                    statusEl.classList.remove('text-red-400');
                    playSequence();
                }, 1000);
            }
        }

        function updateProgressUI() {
            stepEl.innerText = `Step ${userProgress + 1} of ${CONFIG.melody.length}`;
        }


        function transitionTo(screenKey) {
            // Hide all
            Object.values(screens).forEach(s => {
                s.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => s.classList.add('hidden'), 500);
            });

            // Show target
            const target = screens[screenKey];
            setTimeout(() => {
                target.classList.remove('hidden');
                setTimeout(() => {
                    target.classList.remove('opacity-0', 'pointer-events-none', 'scale-95', 'translate-y-10');
                    if(screenKey === 'game') {
                        gameState = 'PLAYING';
                        playSequence();
                    }
                }, 50);
            }, 500);
        }

        // --- EVENT LISTENERS ---
        document.getElementById('btn-start').addEventListener('click', () => {
            initAudio();
            transitionTo('game');
        });

        pads.forEach(pad => {
            pad.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                handlePadPress(pad.dataset.index);
            });
        });

        // Prevention of context menu on long press
        window.oncontextmenu = function(event) {
            event.preventDefault();
            event.stopPropagation();
            return false;
        };

    </script>
</body>
</html>
